<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to JS DOM</title>
    <style>
    button{
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <h1 id="heading">Welcome to JS DOM</h1>
    <button onclick="changeText()">Click Me</button>
    <script>
        function changeText() {
            let heading = document.getElementById("heading");
            heading.innerText = "Hello World!";
            heading.style.color = "blue";
        }
    </script>
</body>
</html>
